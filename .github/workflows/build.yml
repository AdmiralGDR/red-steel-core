name: Build & Verify

# Запускается на push и pull_request в main. Падение тестов блокирует слияние/коммит (required check).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Отменяем устаревшие прогоны на той же ветке/PR — экономим раннеры.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Сборка берёт плагин org.aetherium.gradle и артефакты org.aetherium:* из mavenLocal,
      # а packageForGame собирает jar'ы loader/transformer из исходников фреймворка.
      # На чистом раннере ничего этого нет, поэтому фреймворк выкачивается рядом.
      - name: Checkout Aetherium framework
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: AdmiralGDR/aetherium-framework
          # v1.1.0. Bump together with the framework version the mod targets,
          # so a push to the framework cannot change this build silently.
          ref: 6a94e3093f3261301dc781aab49f4523ccbb0d3d
          path: .aetherium

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Publish framework to mavenLocal
        working-directory: .aetherium
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Point the build at the framework checkout
        run: echo "ORG_GRADLE_PROJECT_aetheriumDir=$GITHUB_WORKSPACE/.aetherium" >> "$GITHUB_ENV"

      # Zero-warning mandate: fail the build if the mod's own sources emit any javac warning.
      - name: Zero-warning gate
        run: bash scripts/check-warnings.sh

      # Full verification gate: self-test (behaviour), jar verification (shipped artifact), packaging.
      - name: Build & verify
        run: ./gradlew --no-daemon --stacktrace clean runSelfTest verifyJar packageForGame

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redsteelcore-jar
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
