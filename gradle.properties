# RedSteelCore — pure Aetherium mod build.
# Sensible Gradle daemon/parallel/cache defaults. Configuration-cache is OFF: the Aetherium plugin
# wires the universal-jar task via afterEvaluate + a runtime-classpath provider, which the
# configuration cache does not support.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
